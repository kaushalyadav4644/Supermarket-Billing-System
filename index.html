<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Supermarket Billing System</h1>

        <div class="product">
            <h3>Product 1</h3>
            <input type="number" id="qty1" placeholder="Quantity">
            <input type="number" id="price1" placeholder="Unit Price">
        </div>

        <div class="product">
            <h3>Product 2</h3>
            <input type="number" id="qty2" placeholder="Quantity">
            <input type="number" id="price2" placeholder="Unit Price">
        </div>

        <div class="product">
            <h3>Product 3</h3>
            <input type="number" id="qty3" placeholder="Quantity">
            <input type="number" id="price3" placeholder="Unit Price">
        </div>

        <button onclick="generateBill()">Generate Bill</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
